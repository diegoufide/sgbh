spring:
  application:
    name: sgbh-web
  profiles:
    default: dev
  datasource:
    url: ${SGBH_DB_URL:jdbc:postgresql://localhost:5432/sgbh}
    username: ${SGBH_DB_USUARIO:sgbh_app}
    password: ${SGBH_DB_CLAVE:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: sgbh
  flyway:
    schemas: sgbh
    default-schema: sgbh
  mail:
    host: ${SGBH_SMTP_HOST:localhost}
    port: ${SGBH_SMTP_PUERTO:587}
    username: ${SGBH_SMTP_USUARIO:}
    password: ${SGBH_SMTP_CLAVE:}
    properties:
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  servlet:
    session:
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info

sgbh:
  iva: 0.13
  cotizacion:
    dias-vigencia: 15
  ia:
    url: ${SGBH_IA_URL:http://localhost:8000}
    token: ${SGBH_IA_TOKEN:}
    tiempo-maximo: 60s
  archivos:
    ruta: ${SGBH_ARCHIVOS_RUTA:./archivos}
