<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · SG Business Hub</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/sgbh.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
<main class="card shadow-sm" style="width: 100%; max-width: 380px;">
    <div class="card-body p-4">
        <h1 class="h5 fw-bold text-center mb-4">SG Business Hub</h1>
        <div class="alert alert-danger" th:if="${param.error}">Correo o contraseña incorrectos.</div>
        <div class="alert alert-success" th:if="${param.salida}">Sesión cerrada correctamente.</div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Correo</label>
                <input type="email" class="form-control" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>
    </div>
</main>
</body>
</html>
