<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE · SG Business Hub">SG Business Hub</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/sgbh.css}">
</head>
<body>
<div class="d-flex">
    <!-- Menú lateral: visible desde lg; en celular se abre como offcanvas -->
    <nav class="offcanvas-lg offcanvas-start sg-menu" tabindex="-1" id="menuLateral" aria-label="Menú principal">
        <div class="offcanvas-header">
            <span class="fw-bold text-white">SG Business Hub</span>
            <button type="button" class="btn-close btn-close-white d-lg-none" data-bs-dismiss="offcanvas"
                    data-bs-target="#menuLateral" aria-label="Cerrar menú"></button>
        </div>
        <div class="offcanvas-body flex-column">
            <a class="sg-menu-item" th:href="@{/}"><i class="bi bi-speedometer2"></i> Tablero</a>
            <a class="sg-menu-item" href="#"><i class="bi bi-people"></i> Clientes</a>
            <a class="sg-menu-item" href="#"><i class="bi bi-inbox"></i> Solicitudes</a>
            <a class="sg-menu-item" href="#"><i class="bi bi-receipt"></i> Cotizaciones</a>
            <a class="sg-menu-item" href="#"><i class="bi bi-kanban"></i> Proyectos</a>
        </div>
    </nav>
    <div class="flex-grow-1 min-vh-100">
        <header class="sg-barra d-flex align-items-center gap-2 px-3 py-2">
            <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#menuLateral" aria-controls="menuLateral" aria-label="Abrir menú">
                <i class="bi bi-list"></i>
            </button>
            <h1 class="h5 fw-bold mb-0" layout:fragment="titulo">Inicio</h1>
            <form class="ms-auto" th:action="@{/logout}" method="post">
                <button class="btn btn-sm btn-outline-primary" type="submit"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </header>
        <main class="p-3 p-lg-4" layout:fragment="contenido"></main>
    </div>
</div>
<script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
</body>
</html>
